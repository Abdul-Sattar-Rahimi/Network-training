<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کارگاه شبکه: سوکت‌زدن سه‌بعدی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--glass:rgba(12,20,27,.78);--ink:#eaf1f5;--mute:#9fb1bd;--line:rgba(255,255,255,.14);--g:#4ee08a;--r:#ff7478}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(12,20,27,.78)}}
:root[data-theme="dark"]{--glass:rgba(12,20,27,.78)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0b1116;overflow:hidden;font-family:"Vazirmatn",Tahoma,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.p{position:fixed;background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
#top{top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#ttl{font-weight:800;font-size:16px}
#dots{display:flex;gap:4px;flex:1;min-width:120px}#dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}#dots i.on{background:var(--g)}
#side{top:80px;right:10px;width:170px;font-size:13px;display:none}
#side div{display:flex;align-items:center;gap:8px;margin:3px 0}
#side s{width:44px;height:12px;border-radius:6px;border:1px solid #0006;display:block}
#bot{bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;right:10px;max-width:640px;margin:0 auto}
#ins{margin:0;font-size:14px;color:var(--mute)}#fb{margin:4px 0;font-weight:600;min-height:24px;font-size:14px}#fb.g{color:var(--g)}#fb.r{color:var(--r)}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);padding:6px 14px;border-radius:9px;cursor:pointer}
button.pri{background:#eaf1f5;color:#0b1116}button.sel{outline:2px solid var(--g)}button:disabled{opacity:.35}
button:focus-visible{outline:3px solid #6aa8ff;outline-offset:2px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1116;font-weight:600}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load">در حال آماده‌سازی کارگاه...</div>
<div class="p" id="top"><b id="ttl"></b><div id="dots"></div><div class="ctl"><button id="cB">T568B</button><button id="cA">T568A</button></div></div>
<div class="p" id="side"></div>
<div class="p" id="bot"><p id="ins"></p><p id="fb"></p>
<div class="ctl"><button id="bk">قبلی</button><button id="act" class="pri"></button><button id="fix">برگرد و ترتیب را درست کن</button><button id="hn">راهنما</button><button id="nx" class="pri">مرحله بعد</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var T=THREE,$=function(i){return document.getElementById(i)};
var BC={o:"#ff6a00",g:"#00b53f",b:"#1f5fff",br:"#7b3f14"};
var WN={wo:"نارنجی‌سفید",o:"نارنجی",wg:"سبز‌سفید",g:"سبز",b:"آبی",wb:"آبی‌سفید",wbr:"قهوه‌ای‌سفید",br:"قهوه‌ای"};
var STD={B:["wo","o","wg","b","wb","g","wbr","br"],A:["wg","g","wo","b","wb","o","wbr","br"]};
var TIPS=[3.5,3.0,3.6,3.1,3.4,3.0,3.3,3.2],XS=-4,TRIM=2.6;
var S={std:"B",st:0,order:[],done:0,sel:null,checked:0,c:.8,hint:1,tcx:9},pdown=0,drag=0,off=0,shake=0,jtx=3.8,pinT=.42,jawT=2.7,sqT=1;

// ---------- renderer & scene
var cv=$("c"),R=new T.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;
R.outputEncoding=T.sRGBEncoding;
var Sc=new T.Scene();Sc.background=new T.Color(0x1a3045);Sc.fog=new T.Fog(0x1a3045,18,38);
var Cam=new T.PerspectiveCamera(40,1,.1,60),camT=new T.Vector3(3,8,8),lookT=new T.Vector3(1.5,.5,0),lookC=lookT.clone();
Sc.add(new T.HemisphereLight(0xdcecff,0x4a3322,.6));
var sp=new T.SpotLight(0xfff3e0,1.2,40,.8,.7);sp.position.set(3,13,6);sp.castShadow=true;sp.shadow.mapSize.set(1024,1024);sp.shadow.bias=-.0004;Sc.add(sp,sp.target);sp.target.position.set(2,0,0);
var lamp=new T.PointLight(0x7ab8ff,.5,20);lamp.position.set(-6,4,-4);Sc.add(lamp);

function canv(w,h,f){var c=document.createElement("canvas");c.width=w;c.height=h;f(c.getContext("2d"),w,h);var t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=4;t.encoding=T.sRGBEncoding;return t}
var wood=canv(512,512,function(g,w,h){g.fillStyle="#8a5a2e";g.fillRect(0,0,w,h);
 for(var i=0;i<260;i++){g.strokeStyle="rgba("+(i%2?"30,15,5":"150,100,55")+","+(Math.random()*.08)+")";g.lineWidth=1+Math.random()*3;var y=Math.random()*h;g.beginPath();g.moveTo(0,y);
  for(var x=0;x<=w;x+=64)g.lineTo(x,y+Math.sin(x/90+i)*3);g.stroke()}});
wood.repeat.set(5,3);
var table=new T.Mesh(new T.PlaneGeometry(50,30),new T.MeshStandardMaterial({map:wood,roughness:.8}));table.rotation.x=-Math.PI/2;table.receiveShadow=true;Sc.add(table);
var mat=canv(512,320,function(g,w,h){g.fillStyle="#1f6b58";g.fillRect(0,0,w,h);g.strokeStyle="rgba(255,255,255,.12)";for(var x=0;x<=w;x+=64){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}for(var y=0;y<=h;y+=64){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}});mat.wrapS=mat.wrapT=T.ClampToEdgeWrapping;
var mt=new T.Mesh(new T.BoxGeometry(15,.06,9),new T.MeshStandardMaterial({map:mat,roughness:.9}));mt.position.set(1.5,.03,0);mt.receiveShadow=true;Sc.add(mt);
var rul=canv(512,32,function(g,w,h){g.fillStyle="#e8d9a8";g.fillRect(0,0,w,h);g.fillStyle="#333";for(var x=0;x<w;x+=8){g.fillRect(x,0,1,x%64?8:16)}});rul.wrapS=T.ClampToEdgeWrapping;
var ruler=new T.Mesh(new T.BoxGeometry(8,.05,.7),new T.MeshStandardMaterial({map:rul}));ruler.position.set(2,.09,3.7);ruler.castShadow=true;Sc.add(ruler);

// ---------- cable
var jm=new T.Mesh(new T.CylinderGeometry(.8,.8,1,48),new T.MeshStandardMaterial({color:0x1a55d6,roughness:.3}));jm.rotation.z=Math.PI/2;jm.position.y=.8;jm.castShadow=true;Sc.add(jm);
var cap=new T.Mesh(new T.CircleGeometry(.8,48),new T.MeshStandardMaterial({color:0xe3ecf2,roughness:.7}));cap.rotation.y=Math.PI/2;cap.position.y=.8;Sc.add(cap);
var W={},WM=[];
["wo","o","wg","g","wb","b","wbr","br"].forEach(function(id,k){
 var tx=canv(32,16,function(g){g.fillStyle=BC[id.replace("w","")];g.fillRect(0,0,32,16);if(id[0]=="w"){g.fillStyle="#f2f2f2";g.fillRect(0,0,16,16)}});
 var m=new T.Mesh(new T.BufferGeometry(),new T.MeshStandardMaterial({map:tx,roughness:.35}));
 m.castShadow=true;m.userData.id=id;m.frustumCulled=false;Sc.add(m);WM.push(m);
 W[id]={m:m,mat:m.material,tx:tx,len:TIPS[k]-XS,tl:TIPS[k]-XS,z:0,tz:0,zc:0,tzc:0,y:.8,ty:.8,tip:TIPS[k],ph:k*1.7,cph:(k%2?Math.PI:0)+Math.floor(k/2)*.9,cu:1,tcu:1,str:0,key:""}});
function buildW(w,jx){var tipx=XS+w.len,x0=Math.min(jx-.5,tipx-.25),pts=[],N=30;
 for(var i=0;i<=N;i++){var x=x0+(tipx-x0)*i/N,f=Math.max(0,Math.min(1,(x-jx)/1.8));f=f*f*(3-2*f);
  var cf=Math.min(1,Math.max(0,(x-jx)/.8))*w.cu*.11,hp=x*9+w.cph,z=w.zc+(w.z-w.zc)*f+Math.sin(x*2.2+w.ph)*.035*f+Math.sin(hp)*cf,u=Math.max(0,Math.min(1,(x-jx)/(tipx-jx+.001))),y=.8+(w.y-.8)*f-.05*Math.sin(Math.PI*u)*f+Math.cos(hp)*cf;
  pts.push(new T.Vector3(x,y,z))}
 w.m.geometry.dispose();w.m.geometry=new T.TubeGeometry(new T.CatmullRomCurve3(pts),N*2,.075,10,false);
 w.tx.repeat.set((tipx-x0)*1.2,1)}

// ---------- connector
var Cn=new T.Group(),clear=new T.MeshStandardMaterial({color:0xcfe6f6,transparent:true,opacity:.28,roughness:.1,depthWrite:false});
var body=new T.Mesh(new T.BoxGeometry(2.4,1.2,1.7),clear);Cn.add(body);
Cn.add(new T.LineSegments(new T.EdgesGeometry(body.geometry),new T.LineBasicMaterial({color:0xdff1ff})));
var latch=new T.Mesh(new T.BoxGeometry(1,.1,1.1),clear);latch.position.set(-.4,.68,0);latch.rotation.z=.08;Cn.add(latch);
var pins=[];for(var i=0;i<8;i++){var p=new T.Mesh(new T.BoxGeometry(.1,.3,.05),new T.MeshPhongMaterial({color:0xe0b040,specular:0xffffff,shininess:120}));p.position.set(.95,.42,(i-3.5)*.17);Cn.add(p);pins.push(p)}
Cn.position.y=.8;Sc.add(Cn);
// crimper
var Cr=new T.Group(),steel=new T.MeshPhongMaterial({color:0x7d8a94,specular:0xffffff,shininess:80});
var jb=new T.Mesh(new T.BoxGeometry(3.2,.25,2.4),steel);jb.position.y=.12;Cr.add(jb);
var jt=new T.Group();var jtm=new T.Mesh(new T.BoxGeometry(3.2,.7,2.4),steel);jt.add(jtm);
var h1=new T.Mesh(new T.BoxGeometry(4,.35,.5),steel);h1.position.x=3.4;jt.add(h1);
var h2=new T.Mesh(new T.BoxGeometry(2,.42,.56),new T.MeshStandardMaterial({color:0xd0383c,roughness:.6}));h2.position.x=5.4;jt.add(h2);
[jtm,h1,h2,jb].forEach(function(m){m.castShadow=true});Cr.add(jt);Cr.visible=false;Sc.add(Cr);
// tester
var LA=[],LB=[],tester=new T.Group();
[-3,3].forEach(function(x,u){var b=new T.Mesh(new T.BoxGeometry(4.2,.6,1.3),new T.MeshStandardMaterial({color:0x2a3138,roughness:.5}));b.position.set(x,.3,-4.6);b.castShadow=true;tester.add(b);
 for(var i=0;i<8;i++){var l=new T.Mesh(new T.SphereGeometry(.17,16,12),new T.MeshStandardMaterial({color:0x1a2228,emissive:0,roughness:.3}));l.position.set(x+(i-3.5)*.5,.68,-4.6);tester.add(l);(u?LB:LA).push(l)}});
var tw=new T.Mesh(new T.CylinderGeometry(.05,.05,1.8,8),new T.MeshStandardMaterial({color:0x8d9aa4}));tw.rotation.z=Math.PI/2;tw.position.set(0,.3,-4.6);tester.add(tw);tester.visible=false;Sc.add(tester);
// blade & zone
var blade=new T.Mesh(new T.BoxGeometry(.05,1.7,2.1),new T.MeshBasicMaterial({color:0xff5560,transparent:true,opacity:.6}));blade.position.y=.8;blade.visible=false;Sc.add(blade);
var zone=new T.Mesh(new T.BoxGeometry(1,1.9,2.2),new T.MeshBasicMaterial({color:0x4ee08a,transparent:true,opacity:.2,depthWrite:false}));zone.position.y=.8;zone.visible=false;Sc.add(zone);

// ---------- helpers
var RC=new T.Raycaster(),M=new T.Vector2(),PL=new T.Plane(new T.Vector3(0,1,0),-.8),P=new T.Vector3();
function aimX(){RC.setFromCamera(M,Cam);return RC.ray.intersectPlane(PL,P)?P.x:null}
function pick(list){RC.setFromCamera(M,Cam);return RC.intersectObjects(list,false)}
function fb(m,g){$("fb").textContent=m;$("fb").className=g?"g":"r"}
function ok(m){S.done=1;$("nx").disabled=false;fb(m,1)}
var AC;function snd(f,d,t,v){try{AC=AC||new AudioContext();var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t||"square";o.frequency.value=f;g.gain.setValueAtTime(v||.04,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
function fan(s){S.order.forEach(function(id,i){W[id].tz=(i-3.5)*s;W[id].tzc=(i-3.5)*.06})}
function ragged(){for(var id in W){W[id].tl=W[id].tip-XS}}
function cxF(){return S.c-.4+1.2}
function mark(){S.order.forEach(function(id,i){W[id].mat.emissive.setHex(S.checked?(id==STD[S.std][i]?0x0a7a3a:0x8a1a1a):0)})}
function shuffle(){var a=STD.B.slice(),m;do{for(var i=7;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}m=0;a.forEach(function(x,i){if(x==STD[S.std][i])m++})}while(m>1);return a}
function sw(c){return"linear-gradient(90deg,"+(c[0]=="w"?"#f4f4f4 0 50%,":"")+BC[c.replace("w","")]+" 50%)"}

// ---------- stages
var STEPS=[
["برش روکش","ماوس را روی کابل حرکت بده. وقتی تیغه روی ناحیه سبز بود کلیک کن تا روکش بریده شود."],
["صاف کردن سیم‌ها","سیم‌ها بعد از برش تابیده‌اند. کلیک چپ را نگه دار و روی سیم‌ها از سمت کابل به سمت نوک بکش. با چند بار کشیدن همه سیم‌ها صاف می‌شوند."],
["چیدن سیم‌ها","روی یک سیم و بعد روی سیم دیگر کلیک کن تا جایشان عوض شود. از بالا به پایین طبق استاندارد بچین."],
["برش هم‌اندازه","تیغه را کنار سیم‌ها ببر و در ناحیه سبز کلیک کن تا نوک همه سیم‌ها یکی شود."],
["وارد کردن در سوکت","سوکت شفاف را بگیر و به سمت سیم‌ها بکش تا کاملا جا بیفتد."],
["کریمپ","دکمه را نگه دار تا کریمپر سوکت را فشار دهد."],
["تست کابل","سر دوم کابل با همان استاندارد درست آماده شده است. تستر باید چراغ هر پین را با پین هم‌شماره روشن کند."]];
var CAMS=[[3,8,8,1.5,.5,0],[4,10,5,2,.5,0],[4,10,5,2,.5,0],[4,10,5,2,.5,0],[5,6,7.5,2,.8,0],[3,5.5,6.5,1.6,.8,0],[0,7,3.5,0,.3,-4]];
$("dots").innerHTML=STEPS.map(function(){return"<i></i>"}).join("");
function go(n){
 S.st=n;S.done=0;S.sel=null;S.checked=0;drag=0;mark();fb("");
 var c=CAMS[n];camT.set(c[0],c[1],c[2]);lookT.set(c[3],c[4],c[5]);
 if(!S.order.length)S.order=shuffle();
 zone.visible=false;blade.visible=false;Cn.visible=n>=4;Cr.visible=n==5;tester.visible=n==6;
 jtx=n==0?3.8:S.c;fan(n==0?.07:.17);if(n<=1){S.prog=0;["wo","o","wg","g","wb","b","wbr","br"].forEach(function(id,k){var w=W[id];w.tz=(Math.floor(k/2)-1.5)*.5+(k%2?.09:-.09);w.str=0;w.tcu=1})}else for(var q in W)W[q].tcu=0;if(n<4)ragged();else for(var id in W)W[id].tl=TRIM-XS;
 sqT=1;pinT=.42;jawT=2.7;S.tcx=n==4?cxF()+5.5:cxF();if(n>=4){Cn.position.x=n==4?S.tcx:cxF()}
 if(n==0||n==3){var lo=n?2.4:.6,hi=n?2.8:1;zone.scale.x=hi-lo;zone.position.x=(lo+hi)/2;zone.visible=true}
 if(n==6)for(var i=0;i<8;i++){led(LA,i,0);led(LB,i,0)}
 if(n==5)Cr.position.x=cxF();
 $("ttl").textContent=(n+1)+". "+STEPS[n][0];$("ins").textContent=STEPS[n][1];
 [].forEach.call($("dots").children,function(d,i){d.className=i<=n?"on":""});
 $("bk").disabled=n==0;$("nx").disabled=true;$("nx").textContent=n==6?"از اول":"مرحله بعد";
 var a=$("act");a.style.display=(n==2||n==5||n==6)?"":"none";a.disabled=false;a.textContent=["","","بررسی ترتیب","","","نگه دار تا کریمپ شود","شروع تست"][n];
 $("fix").style.display="none";$("hn").style.display=n==2?"":"none";side();
 if(n==6)$("nx").disabled=false}
function side(){var s=$("side");s.style.display=S.st==2&&S.hint?"block":"none";
 s.innerHTML="<b>راهنما (بالا به پایین)</b>"+STD[S.std].map(function(id,i){return"<div><span>"+(i+1)+"</span><s style='background:"+sw(id)+"'></s>"+WN[id]+"</div>"}).join("")}
function led(a,i,s){var m=a[i].material;m.emissive.setHex(s=="g"?0x22ff77:s=="r"?0xff2a30:0);m.color.setHex(s=="g"?0x2fd16b:s=="r"?0xe5484d:0x1a2228)}

// ---------- input
function mv(e){M.x=e.clientX/innerWidth*2-1;M.y=-e.clientY/innerHeight*2+1}
cv.addEventListener("pointermove",function(e){mv(e);var x=aimX();
 if(S.st==1){cv.style.cursor=pdown?"grabbing":"grab";if(pdown)rub(e,x);return}
 if(S.st==0||S.st==3){blade.visible=x!==null;if(x!==null)blade.position.x=x}
 else if(S.st==2){var h=pick(WM)[0];cv.style.cursor=h?"pointer":"default"}
 else if(S.st==4){
  if(drag&&x!==null){S.tcx=Math.max(cxF(),Math.min(cxF()+5.5,x-off));
   if(S.tcx<=cxF()+.06){S.tcx=cxF();drag=0;snd(180,.1);snd(1200,.1,"sine");shake=.06;ok("سوکت تا انتها رفت و روکش داخل آن قرار گرفت. صدای کلیک را شنیدی؟")}}
  else cv.style.cursor=pick([body]).length?"grab":"default"}});
cv.addEventListener("pointerdown",function(e){mv(e);var x=aimX();snd(1,.01);if(S.st==1){pdown=1;lx=e.clientX;ly=e.clientY;return}
 if(S.st==0&&x!==null&&!S.done){
  if(x>=.6&&x<=1){S.c=x;jtx=x;fan(.17);zone.visible=blade.visible=false;snd(160,.15,"sawtooth");shake=.04;ok("برش درست بود. روکش جدا شد و ۸ سیم آزاد شدند.")}
  else fb(x<.6?"خیلی زیاد از سیم‌ها بیرون می‌ماند. تیغه را به انتهای کابل نزدیک‌تر کن.":"خیلی کوتاه است. کمی عقب‌تر ببر.")}
 else if(S.st==2){var h=pick(WM)[0];if(!h)return;var id=h.object.userData.id;S.checked=0;mark();
  if(!S.sel){S.sel=id;W[id].ty=1.25;snd(520,.06,"sine")}
  else{if(S.sel!=id){var a=S.order.indexOf(S.sel),b=S.order.indexOf(id),t=S.order[a];S.order[a]=S.order[b];S.order[b]=t;fan(.17);snd(330,.08,"triangle")}
   W[S.sel].ty=.8;S.sel=null;fb("")}}
 else if(S.st==3&&x!==null&&!S.done){
  if(x>=2.4&&x<=2.8){for(var k in W)W[k].tl=TRIM-XS;zone.visible=blade.visible=false;snd(200,.12,"sawtooth");shake=.04;ok("همه سیم‌ها هم‌اندازه شدند.")}
  else fb(x<2.4?"خیلی کوتاه است و سیم‌ها به پین‌ها نمی‌رسند.":"سیم‌های بلندتر هنوز ناهمسان‌اند. نزدیک‌تر به ناحیه سبز و کوتاه‌ترین سیم برش بزن.")}
 else if(S.st==4&&!S.done&&pick([body]).length&&x!==null){drag=1;off=x-Cn.position.x;cv.style.cursor="grabbing"}});
addEventListener("pointerup",function(){drag=0;pdown=0});
var lx=0,ly=0;
function rub(e,x){var d=Math.hypot(e.clientX-lx,e.clientY-ly);lx=e.clientX;ly=e.clientY;
 if(S.done||x===null||x<S.c-.3||x>4.2||Math.abs(P.z)>1.5)return;
 S.prog=Math.min(1,S.prog+d/innerWidth*.4);for(var k in W)W[k].tcu=1-S.prog;
 if(d>6)snd(260+S.prog*500,.03,"triangle",.015);
 fb("صاف شدن سیم‌ها: "+Math.round(S.prog*100)+"٪ . دوباره بکش.",1);
 if(S.prog>=1){pdown=0;cv.style.cursor="default";snd(880,.15,"sine");ok("همه سیم‌ها صاف و آماده چیدن‌اند.")}}

$("act").onclick=function(){
 if(S.st==2){var g=0;S.order.forEach(function(id,i){if(id==STD[S.std][i])g++});S.checked=1;mark();S.done=1;$("nx").disabled=false;

 else if(S.st==6){var b=$("act");b.disabled=true;$("fix").style.display="none";var i=0,bad=[];for(var j=0;j<8;j++){led(LA,j,0);led(LB,j,0)}

  pins.forEach(function(p){p.position.y=L(p.position.y,pinT,.3)})}
 if(Cr.visible){jt.position.y=L(jt.position.y,jawT,.25)}
 par.set(M.x*.6,-M.y*.4,0);

 Cam.lookAt(lookC);R.render(Sc,Cam)}
